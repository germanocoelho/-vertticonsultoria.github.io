name: Motor VERTTI - Verificação diária (retry automático do ciclo mensal)

on:
  schedule:
    - cron: '0 23 20-28 * *'  # todo dia, do 20 ao 28, 23:00 UTC — dá ~11h de folga após o disparo das 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # necessário para poder re-disparar o motor_mensal.yml via API

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o ciclo mensal deste mês já concluiu com sucesso
        id: check
        run: |
          PRECISA_RETRY=$(python3 motor/verificar_ciclo_mensal.py)
          echo "precisa_retry=$PRECISA_RETRY" >> "$GITHUB_OUTPUT"
          echo "precisa retry: $PRECISA_RETRY"

      - name: Re-disparar o ciclo mensal (download ainda não concluiu este mês)
        if: steps.check.outputs.precisa_retry == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/motor_mensal.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Ciclo mensal re-disparado — o motor_mensal.yml tem concurrency group, então ele só roda quando estiver livre, sem duplicar."
