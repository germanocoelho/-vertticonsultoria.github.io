name: Motor VERTTI - Semanal (RPI/INPI)

on:
  schedule:
    - cron: '0 13 * * 3'  # toda quarta-feira, 13:00 UTC (~09:00 em Campo Grande/MS, UTC-4)
    # Horário de expediente de propósito: mesmo que o runner self-hosted não
    # esteja online no minuto exato, o GitHub mantém o job na fila por até
    # 24h esperando a máquina ligar — rodar dentro do expediente normal
    # praticamente garante que isso nunca precise dessa margem.
  workflow_dispatch: {}    # botão "Rodar agora" no ADM

permissions:
  contents: write

jobs:
  rpi:
    runs-on: [self-hosted, vertti-local]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Detectar o comando Python desta máquina
        id: py
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "cmd=python3" >> "$GITHUB_OUTPUT"
          elif command -v python >/dev/null 2>&1; then
            echo "cmd=python" >> "$GITHUB_OUTPUT"
          else
            echo "Python não encontrado nesta máquina."
            exit 1
          fi

      - name: Atualizar base RPI/INPI
        run: ${{ steps.py.outputs.cmd }} motor/pipeline_ci.py semanal

      - name: Commitar base e status
        if: always()
        run: |
          git config user.name  "Motor VERTTI"
          git config user.email "motor@vertticonsultoria.com.br"
          git add marcas_ms.sqlite motor_status.json || true
          git diff --cached --quiet || git commit -m "Motor semanal: base RPI atualizada [skip ci]"
          git push
