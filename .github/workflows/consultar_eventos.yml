name: TESTE - Consultar eventos Brevo

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar eventos de entrega no Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DEST_EMAIL: germano.consneo@gmail.com
        run: python3 consultar_eventos_brevo.py

      - name: Publicar resultado (para leitura via API, sem depender de blob storage)
        if: always()
        run: |
          git config user.name  "Teste VERTTI"
          git config user.email "motor@vertticonsultoria.com.br"
          git add resultado_eventos.json || true
          git diff --cached --quiet || git commit -m "Resultado da consulta de eventos Brevo [skip ci]"
          git push
