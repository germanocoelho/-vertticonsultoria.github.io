name: Motor VERTTI - Disparo diário (aquecimento multi-remetente)

on:
  schedule:
    - cron: '0 13 * * *'   # todo dia, 13:00 UTC (~09:00 Campo Grande/MS) — dentro do expediente
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: motor-mensal   # mesmo grupo do ciclo mensal — nunca roda ao mesmo tempo que ele
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Calcula o ritmo do dia e dispara para cada remetente ativo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 motor/4_disparo_diario.py

      - name: Commitar fila atualizada e status
        if: always()
        run: |
          git config user.name  "Motor VERTTI"
          git config user.email "motor@vertticonsultoria.com.br"
          git add motor_status.json motor_enviados.json marcas_ms.sqlite || true
          git diff --cached --quiet || git commit -m "Disparo diario: fila e status atualizados [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git push; then
              break
            fi
            git pull --rebase origin main
            sleep $((tentativa * 5))
          done
