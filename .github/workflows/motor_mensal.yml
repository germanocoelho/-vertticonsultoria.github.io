name: Motor VERTTI - Mensal (ciclo completo)

on:
  schedule:
    - cron: '0 12 20 * *'  # todo dia 20, 12:00 UTC (~09:00 em Campo Grande/MS) — Receita publica ~meio do mês
  workflow_dispatch: {}     # botão "Rodar agora" no ADM

permissions:
  contents: write
  actions: write   # necessário para o motor_retry_diario.yml poder re-disparar este workflow

concurrency:
  group: motor-mensal
  cancel-in-progress: false   # se o retry diário disparar de novo, ele espera na fila em vez de rodar em paralelo

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 340    # margem para o download de ~5 GB
    steps:
      - uses: actions/checkout@v4

      - name: Pipeline completo (download -> destilaria -> lote -> INPI -> Brevo)
        id: pipeline
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 motor/pipeline_ci.py mensal

      - name: Diagnóstico (publicado direto pela API, sem depender de git)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== resultado do passo pipeline: ${{ steps.pipeline.outcome }} ==="
            echo "=== maquina/runner ==="; hostname; uname -a 2>&1 || true
            echo "=== pwd ==="; pwd
            echo "=== arquivos na raiz do repo ==="; ls -la
            echo "=== arquivos em motor/ ==="; ls -la motor/ 2>&1
            echo "=== motor/dados_receita (se existir) ==="; ls -la motor/dados_receita 2>&1 | head -30
            echo "=== conteudo motor_status.json (se existir) ==="; cat motor_status.json 2>&1
            echo "=== espaco em disco ==="; df -h . 2>&1
            echo "=== python e versao ==="; python3 --version; command -v python3
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          B64=$(base64 -w0 /tmp/diag.txt 2>/dev/null || base64 /tmp/diag.txt | tr -d '\n')
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/diagnostico_ultima_execucao.txt" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            BODY="{\"message\":\"Diagnóstico da execução\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            BODY="{\"message\":\"Diagnóstico da execução\",\"content\":\"$B64\"}"
          fi
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/diagnostico_ultima_execucao.txt" -d "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('commit:', str(d.get('commit',{}).get('sha') or d)[:80])"

      - name: Falhar o job de verdade se o pipeline falhou
        if: steps.pipeline.outcome == 'failure'
        run: exit 1

      - name: Guardar lote como artefato privado (LGPD - e-mails nunca vao ao repositorio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote-do-mes
          path: |
            motor/prospectos_brevo.csv
            motor/conferencia_inpi.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Commitar status, historico, base RPI e diagnostico
        if: always()
        run: |
          git config user.name  "Motor VERTTI"
          git config user.email "motor@vertticonsultoria.com.br"
          git add motor_status.json motor_enviados.json marcas_ms.sqlite funil_historico.json || true
          git diff --cached --quiet || git commit -m "Motor mensal: ciclo executado [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejeitado (provavelmente o motor semanal empurrou ao mesmo tempo) — tentativa $tentativa/5, sincronizando e tentando de novo..."
            git pull --rebase origin main
            sleep $((tentativa * 5))
          done
